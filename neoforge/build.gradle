plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        resources {
            srcDir '../common/src/main/generated'
            exclude '**/.cache/**'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

loom {
    runs {
        dataGen {
            data()
            programArg("--mod")
            programArg("animal_pen_expansion_naturalist_lite")
            programArg("--server")
            programArg("--output")
            programArg(file('../common/src/main/generated/').absolutePath)
            programArg("--existing")
            programArg(file('../common/src/main/resources/').absolutePath)
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

//    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
//    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "curse.maven:naturalist-627986:$rootProject.naturalist_lite_neoforge_version"
    modRuntimeOnly "curse.maven:geckolib-388172:7707149"

    modImplementation "curse.maven:animal-pens-1206722:$rootProject.animal_pen_neoforge_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// ─── Datapack generation ────────────────────────────────────────────────────

tasks.register("generateDatapack", Zip) {
    group       = "mod"
    description = "Assembles a standalone datapack from the mod's data-driven files."

    def mcmeta = """
{
  "pack": {
    "pack_format": 15,
    "description": "${archives_name} data pack v${mod_version}"
  }
}
""".stripIndent().strip()

    from("../common/src/main/generated/") {
        include "data/**"
    }

    doFirst {
        def metaDir = layout.buildDirectory.dir("tmp/datapack-meta").get().asFile
        metaDir.mkdirs()
        new File(metaDir, "pack.mcmeta").text = mcmeta
        from(metaDir)
    }

    archiveFileName      = "${archives_name}-datapack-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir("datapack")
    preserveFileTimestamps = false
    reproducibleFileOrder  = true
}

tasks.named("build") { dependsOn("generateDatapack") }
