plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "animal_pen_expansion_naturalist_lite.mixins.json"
    }

    runs {
        dataGen {
            data()
            programArg("--mod")
            programArg("animal_pen_expansion_naturalist_lite")
            programArg("--server")
            programArg("--output")
            programArg(file('../common/src/main/generated/').absolutePath)
            programArg("--existing")
            programArg(file('../common/src/main/resources/').absolutePath)
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    main {
        resources {
            srcDir '../common/src/main/generated'
            exclude '**/.cache/**'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.4")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "curse.maven:naturalist-627986:$rootProject.naturalist_lite_forge_version"
    modImplementation "software.bernie.geckolib:geckolib-forge-$rootProject.geckolib_forge_version"
    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_forge_version}-forge"

    runtimeOnly "com.eliotlash.mclib:mclib:20"
    runtimeOnly "com.google.code.gson:gson:2.10"
    runtimeOnly "it.unimi.dsi:fastutil:8.5.9"

    modImplementation "curse.maven:animal-pens-1206722:$rootProject.animal_pen_forge_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}


// ─── Datapack generation ────────────────────────────────────────────────────

tasks.register("generateDatapack", Zip) {
    group       = "mod"
    description = "Assembles a standalone datapack from the mod's data-driven files."

    def mcmeta = """
{
  "pack": {
    "pack_format": 15,
    "description": "${archives_name} data pack v${mod_version}"
  }
}
""".stripIndent().strip()

    from("../common/src/main/generated/") {
        include "data/**"
    }

    doFirst {
        def metaDir = layout.buildDirectory.dir("tmp/datapack-meta").get().asFile
        metaDir.mkdirs()
        new File(metaDir, "pack.mcmeta").text = mcmeta
        from(metaDir)
    }

    archiveFileName      = "${archives_name}-datapack-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir("datapack")
    preserveFileTimestamps = false
    reproducibleFileOrder  = true
}

tasks.named("build") { dependsOn("generateDatapack") }